---
updates:
  - file: "manifests/container-security-operator.clusterserviceversion.yaml"
    update_list:
      - search: "    description: Identify image vulnerabilities in Kubernetes pods\n"
        replace: "    description: Identify image vulnerabilities in Kubernetes pods\n    operators.openshift.io/valid-subscription: '[\"OpenShift Platform Plus\", \"Red Hat Quay\"]'\n"
      - search: "  displayName: Container Security\n"
        replace: "  displayName: Red Hat Quay Container Security Operator\n"
      - search: "  maintainers:\n  - email: quay-devel@redhat.com\n    name: Quay Engineering Team\n"
        replace: "  maintainers:\n  - email: support@redhat.com\n    name: Red Hat\n"
